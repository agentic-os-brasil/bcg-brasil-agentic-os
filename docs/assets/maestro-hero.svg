<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc">
  <title id="title">Maestro professional operating system</title>
  <desc id="desc">A dark navy field with a central Maestro mark, connected work, governance and privacy signals.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="0.58" stop-color="#15284D"/>
      <stop offset="1" stop-color="#123A42"/>
    </linearGradient>
    <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#65E4BE"/>
      <stop offset="1" stop-color="#5B8DEF"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1440" height="560" rx="28" fill="url(#bg)"/>
  <circle cx="190" cy="88" r="230" fill="#285B91" opacity=".18"/>
  <circle cx="1290" cy="490" r="290" fill="#12B886" opacity=".12"/>
  <g opacity=".38" stroke="#8EB5FF" fill="none">
    <path d="M188 344C330 344 354 244 510 244" stroke-width="2"/>
    <path d="M930 244C1088 244 1092 152 1250 152" stroke-width="2"/>
    <path d="M930 316C1090 316 1120 414 1250 414" stroke-width="2"/>
  </g>
  <g fill="#8EB5FF">
    <circle cx="188" cy="344" r="7"/><circle cx="510" cy="244" r="7"/>
    <circle cx="930" cy="244" r="7"/><circle cx="1250" cy="152" r="7"/>
    <circle cx="930" cy="316" r="7"/><circle cx="1250" cy="414" r="7"/>
  </g>
  <g transform="translate(510 164)">
    <circle cx="210" cy="116" r="108" fill="#102443" stroke="#77E3C6" stroke-width="2"/>
    <circle cx="210" cy="116" r="75" fill="url(#orb)" opacity=".18" filter="url(#glow)"/>
    <path d="M152 141V86l28 29 30-54 31 54 27-29v55" fill="none" stroke="#D6FFF2" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="210" cy="116" r="10" fill="#F4B942"/>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" text-anchor="middle">
    <text x="720" y="398" fill="#F5F8FF" font-size="54" font-weight="700" letter-spacing="8">MAESTRO</text>
    <text x="720" y="439" fill="#AFC3E8" font-size="22" letter-spacing="2">PROFESSIONAL WORK, CONTINUOUS BY DESIGN</text>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16" font-weight="600" letter-spacing="1">
    <g transform="translate(74 312)"><rect width="180" height="64" rx="14" fill="#132A4D" stroke="#355C92"/><text x="90" y="28" text-anchor="middle" fill="#8EB5FF">WORK</text><text x="90" y="49" text-anchor="middle" fill="#DCE9FF">CONTINUES</text></g>
    <g transform="translate(1158 120)"><rect width="190" height="64" rx="14" fill="#123A42" stroke="#2B9278"/><text x="95" y="28" text-anchor="middle" fill="#77E3C6">GOVERNANCE</text><text x="95" y="49" text-anchor="middle" fill="#D6FFF2">STAYS HUMAN</text></g>
    <g transform="translate(1148 382)"><rect width="200" height="64" rx="14" fill="#2D2948" stroke="#7E70C8"/><text x="100" y="28" text-anchor="middle" fill="#C6BCFF">PRIVACY</text><text x="100" y="49" text-anchor="middle" fill="#F0EDFF">STAYS SCOPED</text></g>
  </g>
</svg>
