name: Maestro data-home inspection

on:
  pull_request:
    paths:
      - 'internal/datahome/**'
      - 'internal/scheduler/**'
      - 'cmd/maestro-runtime/**'
      - '.github/workflows/data-home-inspection.yml'
      - 'go.mod'
      - 'go.sum'
  push:
    branches: [main]
    paths:
      - 'internal/datahome/**'
      - 'internal/scheduler/**'
      - 'cmd/maestro-runtime/**'
      - '.github/workflows/data-home-inspection.yml'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

jobs:
  inspection-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Read-only inspection and shared path contracts
        run: go test ./internal/datahome ./internal/scheduler ./cmd/maestro-runtime
      - name: Static checks at the same boundaries
        run: go vet ./internal/datahome ./internal/scheduler ./cmd/maestro-runtime
