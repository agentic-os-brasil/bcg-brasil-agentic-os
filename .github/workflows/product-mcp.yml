name: Maestro product MCP contracts

on:
  pull_request:
    paths:
      - 'adapters/mcp/**'
      - 'internal/execution/**'
      - 'internal/datahome/**'
      - 'internal/scheduler/**'
      - 'internal/winprivate/**'
      - 'internal/processidentity/**'
      - 'internal/privatelock/**'
      - 'internal/userlevel/**'
      - 'internal/zipmigration/**'
      - 'internal/zipruntime/**'
      - 'go.mod'
      - 'go.sum'
      - 'internal/workspace/**'
      - 'internal/ownerctx/**'
      - 'internal/memory/**'
      - 'internal/atlasops/**'
      - 'schemas/memory-artifact.schema.json'
      - 'schemas/memory-commit.schema.json'
      - 'bundles/**'
      - 'LICENSE.md'
      - 'acceptance/windows-core-pilot.ps1'
      - 'acceptance/windows-engine-*.ps1'
      - 'acceptance/test_windows_profile_driver.py'
      - '.github/workflows/product-mcp.yml'
  push:
    branches: [main]
    paths:
      - 'adapters/mcp/**'
      - 'internal/execution/**'
      - 'internal/datahome/**'
      - 'internal/scheduler/**'
      - 'internal/winprivate/**'
      - 'internal/processidentity/**'
      - 'internal/privatelock/**'
      - 'internal/userlevel/**'
      - 'internal/zipmigration/**'
      - 'internal/zipruntime/**'
      - 'go.mod'
      - 'go.sum'
      - 'internal/workspace/**'
      - 'internal/ownerctx/**'
      - 'internal/memory/**'
      - 'internal/atlasops/**'
      - 'schemas/memory-artifact.schema.json'
      - 'schemas/memory-commit.schema.json'
      - 'bundles/**'
      - 'LICENSE.md'
      - 'acceptance/windows-core-pilot.ps1'
      - 'acceptance/windows-engine-*.ps1'
      - 'acceptance/test_windows_profile_driver.py'
      - '.github/workflows/product-mcp.yml'

permissions:
  contents: read

jobs:
  product-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: adapters/mcp/go.mod
      # shortcut: runner toolcache paths fail Go canonicalization; remove when unchanged witness tests pass there.
      # Related upstream report: https://github.com/golang/go/issues/82447
      - name: Stage Windows SDK for canonical command evidence
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installedRoot = (go env GOROOT).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Installed Go SDK lookup failed' }
          if ($env:GOROOT) { throw 'Command evidence requires no caller-supplied GOROOT' }
          $stagedRoot = Join-Path $env:RUNNER_TEMP 'maestro-go-sdk'
          $freshCache = Join-Path $env:RUNNER_TEMP 'maestro-go-build'
          New-Item -ItemType Directory -Path $stagedRoot -ErrorAction Stop | Out-Null
          New-Item -ItemType Directory -Path $freshCache -ErrorAction Stop | Out-Null
          Get-ChildItem -LiteralPath $installedRoot -Force -ErrorAction Stop |
            Copy-Item -Destination $stagedRoot -Recurse -ErrorAction Stop
          $installedGo = Join-Path $installedRoot 'bin/go.exe'
          $stagedBin = Join-Path $stagedRoot 'bin'
          $stagedGo = Join-Path $stagedBin 'go.exe'
          if ((Get-FileHash -LiteralPath $installedGo -Algorithm SHA256).Hash -ne
              (Get-FileHash -LiteralPath $stagedGo -Algorithm SHA256).Hash) {
            throw 'Staged Go executable differs from pinned SDK'
          }
          $selectedRoot = (& $stagedGo env GOROOT).Trim()
          if ($LASTEXITCODE -ne 0 -or $selectedRoot -ne $stagedRoot) {
            throw 'Staged Go executable did not select its copied SDK'
          }
          $stagedBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "GOCACHE=$freshCache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build exact committed native engine qualification inputs
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./acceptance/windows-engine-build.ps1
      - name: Run all ordinary native owners and public journeys
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./acceptance/windows-core-pilot.ps1 -TestBinary (Join-Path $env:MAESTRO_ENGINE_PUBLIC_ROOT 'bin/mcp.test.exe') -Server (Join-Path $env:MAESTRO_ENGINE_PUBLIC_ROOT 'bin/maestro-mcp.exe') -CanonicalManifest (Join-Path $env:MAESTRO_ENGINE_PUBLIC_ROOT 'engine-build-manifest.json') -OutputRoot (Join-Path $env:RUNNER_TEMP 'native-engine-proof')
      - name: Verify exact-source ordinary proof before host-positive exclusions
        id: windows_engine_proof
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./acceptance/windows-engine-check.ps1
      - name: Canonical ledger, HOME, owner, memory and atlas contracts
        if: runner.os != 'Windows'
        run: go test ./internal/execution ./internal/datahome ./internal/ownerctx ./internal/privatelock ./internal/memory ./internal/atlasops -timeout=300s
      - name: Remaining canonical host contracts after native qualification
        if: runner.os == 'Windows'
        run: go test ./internal/privatelock ./internal/atlasops -timeout=300s
      - name: Canonical workspace initialization contracts on admitted Unix runners
        if: runner.os != 'Windows'
        run: go test ./internal/workspace -timeout=180s
      # Exact-source ordinary execution above qualifies only the closed positive
      # inventory. The elevated host still executes unsafe/elevated/no-bootstrap
      # refusals and every unexcluded package/test below.
      - name: Product protocol, bootstrap refusal and package contracts
        if: runner.os != 'Windows'
        working-directory: adapters/mcp
        run: go test ./... -timeout=600s
      - name: Remaining Windows protocol, unsafe-owner and elevated-host contracts
        if: runner.os == 'Windows'
        working-directory: adapters/mcp
        run: go test ./... -skip '${{ steps.windows_engine_proof.outputs.host_exclusions }}' -timeout=600s
      - name: Product module static checks
        working-directory: adapters/mcp
        run: go vet ./...
      - name: Product binary excludes development packages
        if: runner.os == 'Linux'
        working-directory: adapters/mcp
        shell: bash
        run: |
          dependencies=$(go list -deps ./cmd/maestro-mcp)
          if printf '%s\n' "$dependencies" | grep -E '/(dev/|internal/dev/)'; then
            echo 'A product executable cannot depend on development packages.' >&2
            exit 1
          fi

      - name: Stage only exact bounded Windows engine evidence
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          ./acceptance/windows-engine-evidence.ps1
      - name: Retain this job's native proof and companion outcomes
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: product-windows-native-engine-${{ github.sha }}
          path: ${{ runner.temp }}/native-engine-evidence/
          if-no-files-found: error
          retention-days: 7
