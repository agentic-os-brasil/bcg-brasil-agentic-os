name: Maestro product MCP contracts

on:
  pull_request:
    paths:
      - 'adapters/mcp/**'
      - 'internal/execution/**'
      - 'internal/datahome/**'
      - 'internal/zipmigration/**'
      - 'internal/zipruntime/**'
      - 'internal/adaptercfg/**'
      - 'internal/claudeadapter/**'
      - 'internal/claudeagents/**'
      - 'internal/nativeagentflow/**'
      - 'internal/sessionctx/**'
      - 'internal/sessionhook/**'
      - 'internal/lifecycle/**'
      - 'internal/workspacepolicy/**'
      - 'go.mod'
      - 'go.sum'
      - 'internal/workspace/**'
      - 'internal/ownerctx/**'
      - 'internal/memory/**'
      - 'internal/privatewiki/**'
      - 'internal/processidentity/**'
      - 'internal/atlas/**'
      - 'internal/atlasops/**'
      - 'internal/ingest/**'
      - 'internal/scheduler/**'
      - 'internal/maintenance/**'
      - 'internal/maintenancecatalog/**'
      - 'internal/runtimecap/**'
      - 'internal/skillsindex/**'
      - 'internal/releasecontract/**'
      - 'internal/installer/**'
      - 'internal/installtx/**'
      - 'internal/updateplan/**'
      - 'internal/updateservice/**'
      - 'dev/release/**'
      - 'internal/releaseverify/**'
      - 'internal/releaseprovider/**'
      - 'internal/dev/releasepack/**'
      - 'cmd/maestro-docling-pack/**'
      - 'schemas/memory-artifact.schema.json'
      - 'schemas/memory-commit.schema.json'
      - 'schemas/release-manifest-v2.schema.json'
      - 'schemas/release-generation.schema.json'
      - 'schemas/maintenance-jobs.schema.json'
      - 'bundles/**'
      - 'LICENSE.md'
      - '.github/workflows/product-mcp.yml'
  push:
    branches: [main, 'codex/integration/**']
    paths:
      - 'adapters/mcp/**'
      - 'internal/execution/**'
      - 'internal/datahome/**'
      - 'internal/zipmigration/**'
      - 'internal/zipruntime/**'
      - 'internal/adaptercfg/**'
      - 'internal/claudeadapter/**'
      - 'internal/claudeagents/**'
      - 'internal/nativeagentflow/**'
      - 'internal/sessionctx/**'
      - 'internal/sessionhook/**'
      - 'internal/lifecycle/**'
      - 'internal/workspacepolicy/**'
      - 'go.mod'
      - 'go.sum'
      - 'internal/workspace/**'
      - 'internal/ownerctx/**'
      - 'internal/memory/**'
      - 'internal/privatewiki/**'
      - 'internal/processidentity/**'
      - 'internal/atlas/**'
      - 'internal/atlasops/**'
      - 'internal/ingest/**'
      - 'internal/scheduler/**'
      - 'internal/maintenance/**'
      - 'internal/maintenancecatalog/**'
      - 'internal/runtimecap/**'
      - 'internal/skillsindex/**'
      - 'internal/releasecontract/**'
      - 'internal/installer/**'
      - 'internal/installtx/**'
      - 'internal/updateplan/**'
      - 'internal/updateservice/**'
      - 'dev/release/**'
      - 'internal/releaseverify/**'
      - 'internal/releaseprovider/**'
      - 'internal/dev/releasepack/**'
      - 'cmd/maestro-docling-pack/**'
      - 'schemas/memory-artifact.schema.json'
      - 'schemas/memory-commit.schema.json'
      - 'schemas/release-manifest-v2.schema.json'
      - 'schemas/release-generation.schema.json'
      - 'schemas/maintenance-jobs.schema.json'
      - 'bundles/**'
      - 'LICENSE.md'
      - '.github/workflows/product-mcp.yml'

permissions:
  contents: read

jobs:
  product-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Select physical macOS temporary directory
        if: runner.os == 'macOS'
        shell: bash
        run: |
          physical_temp="$(cd "$RUNNER_TEMP" && pwd -P)"
          printf 'TMPDIR=%s\n' "$physical_temp" >> "$GITHUB_ENV"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: adapters/mcp/go.mod
      # shortcut: runner toolcache paths fail Go canonicalization; remove when unchanged witness tests pass there.
      # Related upstream report: https://github.com/golang/go/issues/82447
      - name: Stage Windows SDK for canonical command evidence
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installedRoot = (go env GOROOT).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Installed Go SDK lookup failed' }
          if ($env:GOROOT) { throw 'Command evidence requires no caller-supplied GOROOT' }
          $stagedRoot = Join-Path $env:RUNNER_TEMP 'maestro-go-sdk'
          $freshCache = Join-Path $env:RUNNER_TEMP 'maestro-go-build'
          New-Item -ItemType Directory -Path $stagedRoot -ErrorAction Stop | Out-Null
          New-Item -ItemType Directory -Path $freshCache -ErrorAction Stop | Out-Null
          Get-ChildItem -LiteralPath $installedRoot -Force -ErrorAction Stop |
            Copy-Item -Destination $stagedRoot -Recurse -ErrorAction Stop
          $installedGo = Join-Path $installedRoot 'bin/go.exe'
          $stagedBin = Join-Path $stagedRoot 'bin'
          $stagedGo = Join-Path $stagedBin 'go.exe'
          if ((Get-FileHash -LiteralPath $installedGo -Algorithm SHA256).Hash -ne
              (Get-FileHash -LiteralPath $stagedGo -Algorithm SHA256).Hash) {
            throw 'Staged Go executable differs from pinned SDK'
          }
          $selectedRoot = (& $stagedGo env GOROOT).Trim()
          if ($LASTEXITCODE -ne 0 -or $selectedRoot -ne $stagedRoot) {
            throw 'Staged Go executable did not select its copied SDK'
          }
          $stagedBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "GOCACHE=$freshCache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Canonical ledger, HOME, owner and memory contracts
        run: go test ./internal/execution ./internal/datahome ./internal/ownerctx ./internal/memory ./internal/privatewiki ./internal/processidentity -timeout=300s
      - name: Canonical workspace initialization contracts on admitted Unix runners
        if: runner.os != 'Windows'
        run: go test ./internal/workspace -timeout=180s
      - name: Canonical workspace knowledge and verified ingestion contracts
        if: runner.os != 'Windows'
        run: go test ./internal/atlasops ./internal/ingest/... ./internal/releasecontract ./internal/releaseverify ./internal/scheduler -timeout=300s
      # These steps validate source contracts, not actual native host qualification.
      - name: Canonical native hook, specialist and private flow contracts
        if: runner.os != 'Windows'
        run: go test ./internal/adaptercfg ./internal/claudeadapter ./internal/claudeagents ./internal/nativeagentflow ./internal/sessionctx ./internal/sessionhook ./internal/lifecycle ./internal/workspacepolicy -timeout=300s
      - name: Canonical maintenance and deterministic diagnosis contracts
        if: runner.os != 'Windows'
        # Run expensive wiki families in their dedicated job; preserve every other
        # owning and legacy/recovery contract here without duplicate selection.
        run: go test ./internal/maintenance ./internal/runtimecap ./internal/skillsindex -skip '^TestProductWiki' -timeout=300s
      # Windows must preserve ownership refusals; this job is not native admission.
      # Its elevated runner cannot qualify ordinary-user workspace initialization.
      - name: Product protocol, bootstrap refusal and package contracts
        working-directory: adapters/mcp
        # The actual first-install tracer runs separately on an admitted native
        # runner. Elevated Windows CI cannot qualify ordinary-user installation.
        run: go test ./... -skip '^(TestModernFactoryFirstInstallAndRestart|TestDirectInnerInstallRequiresProductionAuthority|TestModernSyncedSourceLifecycle|TestSyncedPublicationInterleavingAndReadOnlyReviews|TestModernClientRegistrationLifecycle|TestCurrentClientShippingNativeRefusal)$' -timeout=900s
      - name: Product module static checks
        working-directory: adapters/mcp
        run: go vet ./...
      - name: Product binary excludes development packages
        if: runner.os == 'Linux'
        working-directory: adapters/mcp
        shell: bash
        run: |
          dependencies=$(go list -deps ./cmd/maestro-mcp)
          if printf '%s\n' "$dependencies" | grep -E '/(dev/|internal/dev/)'; then
            echo 'A product executable cannot depend on development packages.' >&2
            exit 1
          fi

  modern-first-install:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Select physical macOS temporary directory
        if: runner.os == 'macOS'
        shell: bash
        run: |
          physical_temp="$(cd "$RUNNER_TEMP" && pwd -P)"
          printf 'TMPDIR=%s\n' "$physical_temp" >> "$GITHUB_ENV"
      - name: Bind fixture paths to the assigned runner
        shell: bash
        env:
          MAESTRO_MODERN_BASELINE: ${{ runner.temp }}/maestro-modern-baseline
          MAESTRO_MODERN_TEST_ROOT: ${{ runner.temp }}/maestro-modern-first-install
          MAESTRO_MODERN_AUTHORITY_ROOT: ${{ runner.temp }}/maestro-modern-authority
        run: |
          printf '%s\n' "MAESTRO_MODERN_BASELINE=$MAESTRO_MODERN_BASELINE" >> "$GITHUB_ENV"
          printf '%s\n' "MAESTRO_MODERN_TEST_ROOT=$MAESTRO_MODERN_TEST_ROOT" >> "$GITHUB_ENV"
          printf '%s\n' "MAESTRO_MODERN_AUTHORITY_ROOT=$MAESTRO_MODERN_AUTHORITY_ROOT" >> "$GITHUB_ENV"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: adapters/mcp/go.mod
      - name: Materialize the immutable pre-modern reader and writer
        shell: bash
        run: |
          git fetch --no-tags origin 62d7758b18b0e9deb616ceacc7c241a34f5b68ce
          mkdir "$MAESTRO_MODERN_BASELINE"
          git archive --format=tar 62d7758b18b0e9deb616ceacc7c241a34f5b68ce -o "$RUNNER_TEMP/maestro-modern-baseline.tar"
          tar -xf "$RUNNER_TEMP/maestro-modern-baseline.tar" -C "$MAESTRO_MODERN_BASELINE"
      - name: Modern signed contracts, review and legacy-provider refusal
        run: go test ./internal/installer ./internal/installtx ./internal/datahome ./internal/releasecontract ./internal/releaseverify ./internal/dev/releasepack ./internal/updateservice -run '^(TestModern|TestInstallationPreviewSharesSelectionWithoutGrantingAuthority|TestCheckModernStateRefusesBeforeProviderAccess|TestLegacySeededBuilderStillRefusesRemovedCLI|TestRootLicenseExceptionRemainsExactAndNonexecutable)' -count=1 -timeout=300s
      # Real factory/server/stdio processes; successful inner native admission
      # uses a controlled in-process fixture. No native client/model is invoked.
      - name: Actual modern factory, authority refusal, packets and restarted work
        working-directory: adapters/mcp
        shell: bash
        run: |
          evidence="$RUNNER_TEMP/maestro-modern-install.jsonl"
          if ! go test ./setup -run '^(TestModernFactoryFirstInstallAndRestart|TestDirectInnerInstallRequiresProductionAuthority)$' -count=1 -json -timeout=600s > "$evidence"; then
            cat "$evidence"
            exit 1
          fi
          cat "$evidence"
          python3 - "$evidence" <<'PYCODE'
          import json, pathlib, sys
          events = [json.loads(line) for line in pathlib.Path(sys.argv[1]).read_text().splitlines()]
          passed = {e.get("Test") for e in events if e.get("Action") == "pass"}
          required = {"TestModernFactoryFirstInstallAndRestart", "TestDirectInnerInstallRequiresProductionAuthority"}
          assert required <= passed, "modern actual-process evidence missing: " + repr(required - passed)
          PYCODE

  modern-synced-update:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Select physical macOS temporary directory
        if: runner.os == 'macOS'
        shell: bash
        run: |
          physical_temp="$(cd "$RUNNER_TEMP" && pwd -P)"
          printf 'TMPDIR=%s\n' "$physical_temp" >> "$GITHUB_ENV"
      - name: Bind fixture paths to the assigned runner
        shell: bash
        env:
          MAESTRO_SYNCED_UPDATE_BASELINE: ${{ runner.temp }}/maestro-synced-update-baseline
          MAESTRO_SYNCED_TEST_ROOT: ${{ runner.temp }}/maestro-synced-update
          MAESTRO_SYNCED_R1_TEST_ROOT: ${{ runner.temp }}/maestro-synced-publication
        run: |
          printf '%s\n' "MAESTRO_SYNCED_UPDATE_BASELINE=$MAESTRO_SYNCED_UPDATE_BASELINE" >> "$GITHUB_ENV"
          printf '%s\n' "MAESTRO_SYNCED_TEST_ROOT=$MAESTRO_SYNCED_TEST_ROOT" >> "$GITHUB_ENV"
          printf '%s\n' "MAESTRO_SYNCED_R1_TEST_ROOT=$MAESTRO_SYNCED_R1_TEST_ROOT" >> "$GITHUB_ENV"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: adapters/mcp/go.mod
      - name: Materialize the exact pre-source-aware public implementation
        shell: bash
        run: |
          git fetch --no-tags origin 8c1ede63fef4b3a5a17d2d4471e4dc5b4f8c37fe
          mkdir "$MAESTRO_SYNCED_UPDATE_BASELINE"
          git archive --format=tar 8c1ede63fef4b3a5a17d2d4471e4dc5b4f8c37fe -o "$RUNNER_TEMP/maestro-synced-update-baseline.tar"
          tar -xf "$RUNNER_TEMP/maestro-synced-update-baseline.tar" -C "$MAESTRO_SYNCED_UPDATE_BASELINE"
      - name: Signed source, private transport and protected custody contracts
        run: go test ./internal/releasecontract ./internal/releaseverify ./internal/releaseprovider ./internal/dev/releasepack ./internal/installtx ./internal/updateplan ./internal/updateservice ./internal/installer -run '^(TestSignedGeneration|TestVerifyGeneration|TestGeneration|TestSourceAwareServerIdentity|TestWriteStateCannotDowngradeProtectedSourceCustody|TestSyncedMetadataExactByteAdmissionBudget|TestSourceCustodyWorstAdmittedExactByteEnvelopesRoundTrip)' -count=1 -timeout=180s
      # Real factory/installer/MCP processes and the preserved old public owner.
      # Positive native admission uses controlled in-process engineering trust;
      # the actual default unsigned installer must still refuse independently.
      - name: Actual signed update, continuation, recovery and compatible rollback
        working-directory: adapters/mcp
        shell: bash
        run: |
          evidence="$RUNNER_TEMP/maestro-modern-synced-update.jsonl"
          if ! go test ./setup -run '^TestModernSyncedSourceLifecycle$' -count=1 -json -timeout=900s > "$evidence"; then
            cat "$evidence"
            exit 1
          fi
          cat "$evidence"
          python3 - "$evidence" <<'PYCODE'
          import json, pathlib, sys
          events = [json.loads(line) for line in pathlib.Path(sys.argv[1]).read_text().splitlines()]
          family = "TestModernSyncedSourceLifecycle"
          assert any(e.get("Action") == "pass" and e.get("Test") == family for e in events), "actual signed lifecycle missing or skipped"
          skipped = [e.get("Test") for e in events if e.get("Action") == "skip" and (e.get("Test") == family or e.get("Test", "").startswith(family + "/"))]
          assert not skipped, "actual signed lifecycle has skipped proof: " + repr(skipped)
          PYCODE

      # Test-only process synchronization preserves the real product identity,
      # source guards and canonical activation; it adds no production pause flag.
      - name: Source-aware publication interleaving and read-only legacy refusal
        working-directory: adapters/mcp
        shell: bash
        run: |
          evidence="$RUNNER_TEMP/maestro-synced-publication.jsonl"
          if ! go test ./setup -run '^TestSyncedPublicationInterleavingAndReadOnlyReviews$' -count=1 -json -timeout=480s > "$evidence"; then
            cat "$evidence"
            exit 1
          fi
          cat "$evidence"
          python3 - "$evidence" <<'PYCODE'
          import json, pathlib, sys
          events = [json.loads(line) for line in pathlib.Path(sys.argv[1]).read_text().splitlines()]
          family = "TestSyncedPublicationInterleavingAndReadOnlyReviews"
          assert any(e.get("Action") == "pass" and e.get("Test") == family for e in events), "actual publication/read-only proof missing or skipped"
          skipped = [e.get("Test") for e in events if e.get("Action") == "skip" and (e.get("Test") == family or e.get("Test", "").startswith(family + "/"))]
          assert not skipped, "actual publication/read-only proof has skipped cases: " + repr(skipped)
          PYCODE

  modern-client-registration:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Select physical macOS temporary directory
        if: runner.os == 'macOS'
        shell: bash
        run: |
          physical_temp="$(cd "$RUNNER_TEMP" && pwd -P)"
          printf 'TMPDIR=%s\n' "$physical_temp" >> "$GITHUB_ENV"
      - name: Bind fixture paths to the assigned runner
        shell: bash
        env:
          MAESTRO_CLIENT_REGISTRATION_BASELINE: ${{ runner.temp }}/maestro-client-registration-baseline
          MAESTRO_CLIENT_REGISTRATION_TEST_ROOT: ${{ runner.temp }}/maestro-client-registration
        run: |
          printf '%s\n' "MAESTRO_CLIENT_REGISTRATION_BASELINE=$MAESTRO_CLIENT_REGISTRATION_BASELINE" >> "$GITHUB_ENV"
          printf '%s\n' "MAESTRO_CLIENT_REGISTRATION_TEST_ROOT=$MAESTRO_CLIENT_REGISTRATION_TEST_ROOT" >> "$GITHUB_ENV"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: adapters/mcp/go.mod
      - name: Materialize exact pre-carrier actual server source
        shell: bash
        run: |
          git fetch --no-tags origin f398d32478c19259932c8ecdaebdc4bcf1380cb9
          mkdir "$MAESTRO_CLIENT_REGISTRATION_BASELINE"
          git archive --format=tar f398d32478c19259932c8ecdaebdc4bcf1380cb9 -o "$RUNNER_TEMP/maestro-client-registration-baseline.tar"
          tar -xf "$RUNNER_TEMP/maestro-client-registration-baseline.tar" -C "$MAESTRO_CLIENT_REGISTRATION_BASELINE"
      # Real current-server generation, installed launch and SDK/stdio; supported
      # client-process witnesses are engineering evidence, not native loading.
      - name: Exact materialization registration recovery and update lifecycle
        working-directory: adapters/mcp
        shell: bash
        run: |
          evidence="$RUNNER_TEMP/maestro-client-registration.jsonl"
          if ! go test ./setup -run '^TestModernClientRegistrationLifecycle$' -count=1 -json -timeout=900s > "$evidence"; then
            cat "$evidence"
            exit 1
          fi
          cat "$evidence"
          python3 - "$evidence" <<'PYCODE'
          import json, pathlib, sys
          events = [json.loads(line) for line in pathlib.Path(sys.argv[1]).read_text().splitlines()]
          family = "TestModernClientRegistrationLifecycle"
          assert any(e.get("Action") == "pass" and e.get("Test") == family for e in events), "actual client lifecycle missing or skipped"
          skipped = [e.get("Test") for e in events if e.get("Action") == "skip" and (e.get("Test") == family or e.get("Test", "").startswith(family + "/"))]
          assert not skipped, "actual client lifecycle skipped proof: " + repr(skipped)
          PYCODE

      - name: Actual shipping client paths preserve native Self admission
        working-directory: adapters/mcp
        shell: bash
        run: |
          evidence="$RUNNER_TEMP/maestro-client-shipping-refusal.jsonl"
          if ! go test ./setup -run '^TestCurrentClientShippingNativeRefusal$' -count=1 -json -timeout=120s > "$evidence"; then
            cat "$evidence"
            exit 1
          fi
          cat "$evidence"
          python3 - "$evidence" <<'PYCODE'
          import json, pathlib, sys
          events = [json.loads(line) for line in pathlib.Path(sys.argv[1]).read_text().splitlines()]
          family = "TestCurrentClientShippingNativeRefusal"
          assert any(e.get("Action") == "pass" and e.get("Test") == family for e in events), "actual shipping native refusal missing or skipped"
          skipped = [e.get("Test") for e in events if e.get("Action") == "skip" and (e.get("Test") == family or e.get("Test", "").startswith(family + "/"))]
          assert not skipped, "shipping refusal skipped proof: " + repr(skipped)
          PYCODE

  wiki-maintenance-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Select physical macOS temporary directory
        if: runner.os == 'macOS'
        shell: bash
        run: |
          physical_temp="$(cd "$RUNNER_TEMP" && pwd -P)"
          printf 'TMPDIR=%s\n' "$physical_temp" >> "$GITHUB_ENV"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: adapters/mcp/go.mod
      - name: Finite wiki maintenance families and exact terminal recovery
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import json, os, pathlib, re, subprocess
          package = "./internal/maintenance"
          listed = subprocess.check_output(["go", "test", package, "-list", "^TestProductWiki"], text=True)
          names = [line for line in listed.splitlines() if re.fullmatch(r"TestProductWiki[A-Za-z0-9_]+", line)]
          required = {
              "TestProductWikiStaleReviewAndClockOnlyNoopCannotQualify",
              "TestProductWikiCadenceEnrollmentAndReplay",
              "TestProductWikiLiveFencesBeforePointer",
              "TestProductWikiTerminalFencesAfterActualEffect",
              "TestProductWikiDiagnosticPointerHonorsDeniedPublication",
              "TestProductWikiEventOnlyControlAndReceiptRefuseTampering",
              "TestProductWikiEventRecoveryAfterPartialEffect",
              "TestProductWikiEventClosureAfterReconcile",
              "TestProductWikiEventClosureRetainsRecoveryEvidence",
          }
          assert required <= set(names) and len(names) == len(set(names)), "wiki family selection is incomplete"
          # Prior slowest original family:89.90s. The expanded exact-event
          # evidence/recovery family measured115.09s, so receives240s; other
          # families receive180s. Failed360s combined runs are not reused as PASS.
          for name in names:
              evidence = pathlib.Path(os.environ["RUNNER_TEMP"]) / (name + ".jsonl")
              deadline = "240s" if name == "TestProductWikiEventClosureAfterReconcile" else "180s"
              with evidence.open("w") as output:
                  result = subprocess.run(["go", "test", package, "-run", "^" + name + "$", "-count=1", "-json", "-timeout=" + deadline], stdout=output)
              print(evidence.read_text(), flush=True)
              assert result.returncode == 0, "wiki family failed: " + name
              events = [json.loads(line) for line in evidence.read_text().splitlines()]
              assert any(e.get("Action") == "pass" and e.get("Test") == name for e in events), "wiki family skipped or missing: " + name
          PYCODE

  authenticated-docling:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Select physical macOS temporary directory
        if: runner.os == 'macOS'
        shell: bash
        run: |
          physical_temp="$(cd "$RUNNER_TEMP" && pwd -P)"
          printf 'TMPDIR=%s\n' "$physical_temp" >> "$GITHUB_ENV"
      - name: Bind fixture paths to the assigned runner
        shell: bash
        env:
          MAESTRO_DOCLING_TEST_INPUTS: ${{ runner.temp }}/maestro-raw-inputs
          MAESTRO_DOCLING_TEST_ROOT: ${{ runner.temp }}/maestro-engineering-runtime
          MAESTRO_DOCLING_RETAINED_ROOT: ${{ runner.temp }}/maestro-engineering-runtime
        run: |
          printf '%s\n' "MAESTRO_DOCLING_TEST_INPUTS=$MAESTRO_DOCLING_TEST_INPUTS" >> "$GITHUB_ENV"
          printf '%s\n' "MAESTRO_DOCLING_TEST_ROOT=$MAESTRO_DOCLING_TEST_ROOT" >> "$GITHUB_ENV"
          printf '%s\n' "MAESTRO_DOCLING_RETAINED_ROOT=$MAESTRO_DOCLING_RETAINED_ROOT" >> "$GITHUB_ENV"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: adapters/mcp/go.mod
      - name: Require the admitted runtime platform
        shell: bash
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          test -x /usr/bin/sandbox-exec
      # Acquisition is CI-only; the offline assembler verifies every input again.
      - name: Acquire exact official runtime inputs
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import hashlib, json, os, pathlib, re, urllib.parse, urllib.request
          root = pathlib.Path(os.environ["MAESTRO_DOCLING_TEST_INPUTS"])
          root.mkdir(mode=0o700)
          source = pathlib.Path("internal/ingest/docling/assemble.go").read_text()
          def constant(name):
              match = re.search(r'^\s*' + name + r'\s*=\s*"([^"\n]+)"', source, re.M)
              assert match, "missing canonical runtime constant: " + name
              return match.group(1)
          filename, expected = constant("PythonArchive"), constant("PythonArchiveSHA256")
          tag = constant("PythonVersion").split("+")[1]
          assert re.fullmatch(r"[0-9]{8}", tag)
          inputs = json.loads(pathlib.Path("internal/ingest/docling/runtime/inputs.json").read_text())
          assert len(inputs) == 45 and len({x["filename"] for x in inputs}) == 45
          assert sum(x["size"] for x in inputs) <= 512 << 20
          for item in inputs:
              parsed = urllib.parse.urlsplit(item["url"])
              assert parsed.scheme == "https" and parsed.netloc == "files.pythonhosted.org"
          inputs.append({"filename": filename, "sha256": expected, "size": 256 << 20,
                         "url": "https://github.com/astral-sh/python-build-standalone/releases/download/" + tag + "/" + filename})
          for item in inputs:
              name, expected, size = item["filename"], item["sha256"], item["size"]
              assert pathlib.PurePosixPath(name).name == name and name not in (".", "..") and "\\" not in name
              assert re.fullmatch(r"[0-9a-f]{64}", expected) and 0 < size <= 256 << 20
              target = root / name
              digest, count = hashlib.sha256(), 0
              request = urllib.request.Request(item["url"], headers={"User-Agent": "maestro-runtime-ci"})
              with urllib.request.urlopen(request, timeout=60) as response, target.open("xb") as output:
                  while chunk := response.read(1 << 20):
                      count += len(chunk)
                      assert count <= size, "input exceeds pinned size: " + name
                      digest.update(chunk)
                      output.write(chunk)
              assert digest.hexdigest() == expected, "input digest mismatch: " + name
              if name != filename:
                  assert count == size, "input size mismatch: " + name
              print("verified", name, count, expected)
          PYCODE
      - name: Prove authenticated offline conversion and refusal contracts
        shell: bash
        run: |
          evidence="$RUNNER_TEMP/maestro-docling-tests.jsonl"
          if ! go test ./internal/ingest/docling -run '^TestAuthenticatedRealDocling$' -count=1 -json -timeout=900s > "$evidence"; then
            cat "$evidence"
            exit 1
          fi
          cat "$evidence"
          python3 - "$evidence" <<'PYCODE'
          import json, pathlib, sys
          events = [json.loads(line) for line in pathlib.Path(sys.argv[1]).read_text().splitlines()]
          assert any(e.get("Action") == "pass" and e.get("Test") == "TestAuthenticatedRealDocling" for e in events), "real converter acceptance did not run"
          PYCODE
      - name: Bind the retained public engineering authority
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import hashlib, os, pathlib
          root = pathlib.Path(os.environ["MAESTRO_DOCLING_RETAINED_ROOT"])
          seed = hashlib.sha256((root / "authority.json").read_bytes()).hexdigest()
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write("MAESTRO_DOCLING_RETAINED_SEED=" + seed + "\n")
          PYCODE
      - name: Prove actual SDK and compiled-stdio content journeys
        working-directory: adapters/mcp
        shell: bash
        run: |
          evidence="$RUNNER_TEMP/maestro-content-tests.jsonl"
          if ! go test . -run '^TestContentRealJourneys$' -count=1 -json -timeout=900s > "$evidence"; then
            cat "$evidence"
            exit 1
          fi
          cat "$evidence"
          python3 - "$evidence" <<'PYCODE'
          import json, pathlib, sys
          events = [json.loads(line) for line in pathlib.Path(sys.argv[1]).read_text().splitlines()]
          passed = {e.get("Test") for e in events if e.get("Action") == "pass"}
          required = {"TestContentRealJourneys/sdk", "TestContentRealJourneys/compiled_stdio"}
          assert required <= passed, "real SDK/stdio content acceptance did not run: " + repr(required - passed)
          PYCODE
