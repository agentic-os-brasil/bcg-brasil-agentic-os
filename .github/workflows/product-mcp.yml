on:
  pull_request:
    paths:
      - 'adapters/mcp/**'
      - 'internal/execution/**'
      - 'internal/datahome/**'
      - 'internal/zipmigration/**'
      - 'internal/winprivate/**'
      - 'internal/zipruntime/**'
      - 'internal/adaptercfg/**'
      - 'internal/claudeadapter/**'
      - 'internal/claudeagents/**'
      - 'internal/nativeagentflow/**'
      - 'internal/sessionctx/**'
      - 'internal/sessionhook/**'
      - 'internal/lifecycle/**'
      - 'internal/workspacepolicy/**'
      - 'go.mod'
      - 'go.sum'
      - 'internal/workspace/**'
      - 'internal/ownerctx/**'
      - 'internal/memory/**'
      - 'internal/privatewiki/**'
      - 'internal/processidentity/**'
      - 'internal/atlas/**'
      - 'internal/atlasops/**'
      - 'internal/ingest/**'
      - 'internal/scheduler/**'
      - 'internal/darwin/**'
      - 'internal/maintenance/**'
      - 'internal/maintenancecatalog/**'
      - 'internal/runtimecap/**'
      - 'internal/skillsindex/**'
      - 'internal/releasecontract/**'
      - 'internal/installer/**'
      - 'internal/installtx/**'
      - 'internal/updateplan/**'
      - 'internal/updateservice/**'
      - 'dev/release/**'
      - 'dev/pilot/private-wiki-producer/**'
      - 'dev/pilot/private-wiki-old-cohort/**'
      - 'acceptance/test_windows_profile_driver.py'
      - 'internal/releaseverify/**'
      - 'internal/releaseprovider/**'
      - 'internal/dev/releasepack/**'
      - 'cmd/maestro-docling-pack/**'
      - 'schemas/memory-artifact.schema.json'
      - 'schemas/memory-commit.schema.json'
      - 'schemas/release-manifest-v2.schema.json'
      - 'schemas/release-generation.schema.json'
      - 'schemas/maintenance-jobs.schema.json'
      - 'bundles/**'
      - 'LICENSE.md'
      - 'acceptance/windows-core-pilot.ps1'
      - '.github/workflows/product-mcp.yml'
  push:
    branches: [main, 'codex/integration/**', 'codex/maestro-windows-canonical']
    paths:
      - 'adapters/mcp/**'
      - 'internal/execution/**'
      - 'internal/datahome/**'
      - 'internal/zipmigration/**'
      - 'internal/winprivate/**'
      - 'internal/zipruntime/**'
      - 'internal/adaptercfg/**'
      - 'internal/claudeadapter/**'
      - 'internal/claudeagents/**'
      - 'internal/nativeagentflow/**'
      - 'internal/sessionctx/**'
      - 'internal/sessionhook/**'
      - 'internal/lifecycle/**'
      - 'internal/workspacepolicy/**'
      - 'go.mod'
      - 'go.sum'
      - 'internal/workspace/**'
      - 'internal/ownerctx/**'
      - 'internal/memory/**'
      - 'internal/privatewiki/**'
      - 'internal/processidentity/**'
      - 'internal/atlas/**'
      - 'internal/atlasops/**'
      - 'internal/ingest/**'
      - 'internal/scheduler/**'
      - 'internal/darwin/**'
      - 'internal/maintenance/**'
      - 'internal/maintenancecatalog/**'
      - 'internal/runtimecap/**'
      - 'internal/skillsindex/**'
      - 'internal/releasecontract/**'
      - 'internal/installer/**'
      - 'internal/installtx/**'
      - 'internal/updateplan/**'
      - 'internal/updateservice/**'
      - 'dev/release/**'
      - 'dev/pilot/private-wiki-producer/**'
      - 'dev/pilot/private-wiki-old-cohort/**'
      - 'acceptance/test_windows_profile_driver.py'
      - 'internal/releaseverify/**'
      - 'internal/releaseprovider/**'
      - 'internal/dev/releasepack/**'
      - 'cmd/maestro-docling-pack/**'
      - 'schemas/memory-artifact.schema.json'
      - 'schemas/memory-commit.schema.json'
      - 'schemas/release-manifest-v2.schema.json'
      - 'schemas/release-generation.schema.json'
      - 'schemas/maintenance-jobs.schema.json'
      - 'bundles/**'
      - 'LICENSE.md'
      - 'acceptance/windows-core-pilot.ps1'
      - '.github/workflows/product-mcp.yml'

permissions:
  contents: read

jobs:
  product-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Record Windows canonical qualification source
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          QUALIFICATION_SOURCE: ${{ github.sha }}
          QUALIFICATION_REF: ${{ github.ref }}
        run: Write-Output "canonical_workflow source=$env:QUALIFICATION_SOURCE ref=$env:QUALIFICATION_REF profile=not_started"
      - name: Select physical macOS temporary directory
        if: runner.os == 'macOS'
        shell: bash
        run: |
          physical_temp="$(cd "$RUNNER_TEMP" && pwd -P)"
          printf 'TMPDIR=%s\n' "$physical_temp" >> "$GITHUB_ENV"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: adapters/mcp/go.mod
      # shortcut: runner toolcache paths fail Go canonicalization; remove when unchanged witness tests pass there.
      # Related upstream report: https://github.com/golang/go/issues/82447
      - name: Stage Windows SDK for canonical command evidence
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installedRoot = (go env GOROOT).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Installed Go SDK lookup failed' }
          if ($env:GOROOT) { throw 'Command evidence requires no caller-supplied GOROOT' }
          $publicRoot = Join-Path $env:SystemDrive ('MaestroCanonical-' + [Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $publicRoot -ErrorAction Stop | Out-Null
          $acl = [Security.AccessControl.DirectorySecurity]::new()
          $acl.SetAccessRuleProtection($true, $false)
          foreach ($sid in @('S-1-5-18', 'S-1-5-32-544')) {
            $rule = [Security.AccessControl.FileSystemAccessRule]::new([Security.Principal.SecurityIdentifier]::new($sid), 'FullControl', 'ContainerInherit,ObjectInherit', 'None', 'Allow')
            $acl.AddAccessRule($rule)
          }
          $readers = [Security.AccessControl.FileSystemAccessRule]::new([Security.Principal.SecurityIdentifier]::new('S-1-5-32-545'), 'ReadAndExecute', 'ContainerInherit,ObjectInherit', 'None', 'Allow')
          $acl.AddAccessRule($readers)
          Set-Acl -LiteralPath $publicRoot -AclObject $acl
          $stagedRoot = Join-Path $publicRoot 'sdk'
          $freshCache = Join-Path $env:RUNNER_TEMP 'maestro-go-build'
          New-Item -ItemType Directory -Path $stagedRoot -ErrorAction Stop | Out-Null
          New-Item -ItemType Directory -Path $freshCache -ErrorAction Stop | Out-Null
          Get-ChildItem -LiteralPath $installedRoot -Force -ErrorAction Stop |
            Copy-Item -Destination $stagedRoot -Recurse -ErrorAction Stop
          $installedGo = Join-Path $installedRoot 'bin/go.exe'
          $stagedBin = Join-Path $stagedRoot 'bin'
          $stagedGo = Join-Path $stagedBin 'go.exe'
          if ((Get-FileHash -LiteralPath $installedGo -Algorithm SHA256).Hash -ne
              (Get-FileHash -LiteralPath $stagedGo -Algorithm SHA256).Hash) {
            throw 'Staged Go executable differs from pinned SDK'
          }
          $selectedRoot = (& $stagedGo env GOROOT).Trim()
          if ($LASTEXITCODE -ne 0 -or $selectedRoot -ne $stagedRoot) {
            throw 'Staged Go executable did not select its copied SDK'
          }
          $stagedBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "GOCACHE=$freshCache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MAESTRO_CANONICAL_PUBLIC_ROOT=$publicRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build unchanged Windows canonical witnesses from public source fixtures
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $publicRoot = $env:MAESTRO_CANONICAL_PUBLIC_ROOT
          $sourceRoot = Join-Path $publicRoot 'source'
          $binaryRoot = Join-Path $publicRoot 'bin'
          New-Item -ItemType Directory -Path $sourceRoot, $binaryRoot -ErrorAction Stop | Out-Null
          $checkoutRoot = (Get-Location).Path
          $historicalRevision = 'f93e9ce21edcd19246e7e5985d97489297dae18b'
          git cat-file -e ($historicalRevision + '^{commit}') 2>$null
          if ($LASTEXITCODE -ne 0) {
            git fetch --no-tags --depth=1 origin $historicalRevision
            if ($LASTEXITCODE -ne 0) { throw 'Pinned historical library fetch failed.' }
          }
          $actualHistorical = (git rev-parse ($historicalRevision + '^{commit}')).Trim()
          if ($LASTEXITCODE -ne 0 -or $actualHistorical -cne $historicalRevision) { throw 'Historical library object differs from its fixed commit.' }
          $revision = (git rev-parse HEAD).Trim()
          $archive = Join-Path $env:RUNNER_TEMP 'canonical-source.tar'
          git archive --format=tar --output=$archive HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Exact committed canonical source archive failed.' }
          tar -xf $archive -C $sourceRoot
          if ($LASTEXITCODE -ne 0) { throw 'Public canonical source fixture staging failed.' }
          $sdkRoot = Join-Path $publicRoot 'sdk'
          $sdkGo = Join-Path $sdkRoot 'bin/go.exe'
          $entries = @()
          Push-Location -LiteralPath $sourceRoot
          try {
            foreach ($name in @('execution', 'datahome', 'ownerctx', 'memory', 'privatewiki', 'processidentity', 'winprivate', 'zipmigration')) {
              $package = './internal/' + $name
              $binary = Join-Path $binaryRoot ($name + '.test.exe')
              & $sdkGo test -c $package -o $binary
              if ($LASTEXITCODE -ne 0) { throw "Canonical witness build failed: $package" }
              $tests = @(& $binary '-test.list' '^(Test|Example)')
              if ($LASTEXITCODE -ne 0 -or $tests.Count -eq 0) { throw "Canonical inventory failed: $package" }
              $entries += [ordered]@{
                name=$name; package=$package; binary=$binary
                sha256=(Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash.ToLowerInvariant()
                working_directory=(Join-Path $sourceRoot ('internal/' + $name)); tests=$tests
              }
            }
            & $sdkGo mod vendor
            if ($LASTEXITCODE -ne 0) { throw 'Compatible producer staging-only vendor closure failed.' }
            $vendorRoot = Join-Path $sourceRoot 'vendor'
            $vendorFiles = @(Get-ChildItem -LiteralPath $vendorRoot -Recurse -File | Sort-Object FullName | ForEach-Object {
              if (($_.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) { throw 'Producer vendor input must be an ordinary file.' }
              [ordered]@{path=$_.FullName.Substring($vendorRoot.Length + 1).Replace('\','/'); sha256=(Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()}
            })
            $producerRoot = Join-Path $publicRoot 'compatible-producer'
            $hadGoFlags = Test-Path Env:GOFLAGS
            $priorGoFlags = $env:GOFLAGS
            try {
              $env:GOFLAGS = '-mod=vendor -buildvcs=false'
              python (Join-Path $sourceRoot 'dev/pilot/private-wiki-producer/build.py') $producerRoot --source-revision $revision --go $sdkGo
              if ($LASTEXITCODE -ne 0) { throw 'Actual compatible producer build failed.' }
            } finally {
              if ($hadGoFlags) { $env:GOFLAGS = $priorGoFlags }
              else { Remove-Item Env:GOFLAGS -ErrorAction SilentlyContinue }
            }
            $producerBuildPath = Join-Path $producerRoot 'producer-build.json'
            $producerBuild = Get-Content -LiteralPath $producerBuildPath -Raw -Encoding UTF8 | ConvertFrom-Json
            $producer = [ordered]@{
              build_manifest=$producerBuildPath
              build_manifest_sha256=(Get-FileHash -LiteralPath $producerBuildPath -Algorithm SHA256).Hash.ToLowerInvariant()
              source_archive_sha256=(Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
              sdk_go_sha256=(Get-FileHash -LiteralPath $sdkGo -Algorithm SHA256).Hash.ToLowerInvariant()
              executable=$producerBuild.executable; executable_sha256=$producerBuild.executable_sha256
            }
            $historicalRoot = Join-Path $publicRoot 'historical-witness'
            # The builder requires Git provenance; its library build is offline and unchanged.
            python (Join-Path $checkoutRoot 'dev/pilot/private-wiki-old-cohort/build.py') $historicalRoot --go $sdkGo
            if ($LASTEXITCODE -ne 0) { throw 'Actual historical-library harness build failed.' }
            $historicalBuildPath = Join-Path $historicalRoot 'historical-build.json'
            $historicalBuild = Get-Content -LiteralPath $historicalBuildPath -Raw -Encoding UTF8 | ConvertFrom-Json
            $inventoryBytes = [Text.Encoding]::UTF8.GetBytes(($historicalBuild.original_library_files | ConvertTo-Json -Depth 6 -Compress))
            $hasher = [Security.Cryptography.SHA256]::Create()
            try { $inventoryHash = ([BitConverter]::ToString($hasher.ComputeHash($inventoryBytes))).Replace('-','').ToLowerInvariant() }
            finally { $hasher.Dispose() }
            $historical = [ordered]@{
              build_manifest=$historicalBuildPath
              build_manifest_sha256=(Get-FileHash -LiteralPath $historicalBuildPath -Algorithm SHA256).Hash.ToLowerInvariant()
              original_archive_sha256=$historicalBuild.original_archive_sha256
              original_library_inventory_sha256=$inventoryHash
              sdk_go_sha256=(Get-FileHash -LiteralPath $sdkGo -Algorithm SHA256).Hash.ToLowerInvariant()
              executable=$historicalBuild.executable; executable_sha256=$historicalBuild.executable_sha256
            }
            Push-Location -LiteralPath (Join-Path $sourceRoot 'adapters/mcp')
            try {
              & $sdkGo test -c . -o (Join-Path $binaryRoot 'windows-core.test.exe')
              if ($LASTEXITCODE -ne 0) { throw 'Existing core witness build failed.' }
              & $sdkGo build -o (Join-Path $binaryRoot 'maestro-mcp.exe') ./cmd/maestro-mcp
              if ($LASTEXITCODE -ne 0) { throw 'Existing shipping server build failed.' }
            } finally { Pop-Location }
          } finally { Pop-Location }
          $manifest = [ordered]@{
            schema_version=1; source_revision=$revision; source_root=$sourceRoot
            qualification_profile='windows_public_external_migration_v1'
            sdk_root=$sdkRoot; sdk_go=$sdkGo
            sdk_go_sha256=(Get-FileHash -LiteralPath $sdkGo -Algorithm SHA256).Hash.ToLowerInvariant()
            source_archive=$archive; source_archive_sha256=(Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
            vendor_files=$vendorFiles; compatible_producer=$producer; historical_witness=$historical
            packages=$entries
          }
          $manifest | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $publicRoot 'canonical-contract-manifest.json') -Encoding utf8
      - name: Canonical ledger, HOME, owner and memory contracts on Unix
        if: runner.os != 'Windows'
        run: go test ./internal/execution ./internal/datahome ./internal/ownerctx ./internal/memory ./internal/privatewiki ./internal/processidentity -timeout=300s
      - name: Canonical Windows contracts under the existing ordinary-user profile
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $publicRoot = $env:MAESTRO_CANONICAL_PUBLIC_ROOT
          ./acceptance/windows-core-pilot.ps1 -TestBinary (Join-Path $publicRoot 'bin/windows-core.test.exe') -Server (Join-Path $publicRoot 'bin/maestro-mcp.exe') -OutputRoot (Join-Path $env:RUNNER_TEMP 'canonical-native-proof') -CanonicalManifest (Join-Path $publicRoot 'canonical-contract-manifest.json')
      - name: Stage only bounded Windows canonical evidence
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $proof = Join-Path $env:RUNNER_TEMP 'canonical-native-proof'
          $evidence = Join-Path $env:RUNNER_TEMP 'canonical-profile-evidence'
          New-Item -ItemType Directory -Path $evidence -ErrorAction Stop | Out-Null
          $sources = @([pscustomobject]@{
            root=$proof
            names=@('native-test.stdout.log', 'native-test.stderr.log', 'native-core-proof.json',
              'canonical-execution.log', 'canonical-datahome.log', 'canonical-ownerctx.log',
              'canonical-memory.log', 'canonical-privatewiki.log', 'canonical-processidentity.log',
              'canonical-winprivate.log', 'canonical-zipmigration.log',
              'canonical-contract-results.json')
          })
          if ($env:MAESTRO_CANONICAL_PUBLIC_ROOT) {
            $sources += [pscustomobject]@{root=$env:MAESTRO_CANONICAL_PUBLIC_ROOT; names=@('canonical-contract-manifest.json')}
            $sources += [pscustomobject]@{root=(Join-Path $env:MAESTRO_CANONICAL_PUBLIC_ROOT 'compatible-producer'); names=@('producer-build.json', 'build.stdout.log', 'build.stderr.log')}
            $sources += [pscustomobject]@{root=(Join-Path $env:MAESTRO_CANONICAL_PUBLIC_ROOT 'historical-witness'); names=@('historical-build.json')}

          }
          foreach ($source in $sources) {
            if (-not (Test-Path -LiteralPath $source.root)) { continue }
            $directory = Get-Item -LiteralPath $source.root -Force
            if (-not $directory.PSIsContainer -or ($directory.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
              throw 'Evidence source must be an ordinary directory; it will not be uploaded.'
            }
            foreach ($name in $source.names) {
              $path = Join-Path $source.root $name
              if (-not (Test-Path -LiteralPath $path)) { continue }
              $entry = Get-Item -LiteralPath $path -Force
              if ($entry -isnot [IO.FileInfo] -or ($entry.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or $entry.Length -gt 2097152) {
                throw 'Evidence is not a bounded ordinary synthetic proof file; it will not be uploaded.'
              }
              $destination = Join-Path $evidence $name
              $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash
              Copy-Item -LiteralPath $path -Destination $destination -ErrorAction Stop
              if ((Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash -cne $hash) {
                throw 'Staged evidence differs from the original proof bytes.'
              }
            }
          }
      - name: Retain exact Windows canonical profile evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-canonical-profile-${{ github.sha }}
          path: ${{ runner.temp }}/canonical-profile-evidence/
          if-no-files-found: error
          retention-days: 7
      - name: Canonical workspace initialization contracts on admitted Unix runners
        if: runner.os != 'Windows'
        run: go test ./internal/workspace -timeout=180s
      - name: Canonical workspace knowledge and verified ingestion contracts
        if: runner.os != 'Windows'
        run: go test ./internal/atlasops ./internal/ingest/... ./internal/releasecontract ./internal/releaseverify ./internal/scheduler -timeout=300s
      # These steps validate source contracts, not actual native host qualification.
      - name: Canonical native hook, specialist and private flow contracts
        if: runner.os != 'Windows'
        run: go test ./internal/adaptercfg ./internal/claudeadapter ./internal/claudeagents ./internal/nativeagentflow ./internal/sessionctx ./internal/sessionhook ./internal/lifecycle ./internal/workspacepolicy -timeout=300s
      - name: Canonical maintenance and deterministic diagnosis contracts
        if: runner.os != 'Windows'
        # Run expensive wiki families in their dedicated job; preserve every other
        # owning and legacy/recovery contract here without duplicate selection.
        run: go test ./internal/maintenance ./internal/runtimecap ./internal/skillsindex -skip '^TestProductWiki' -timeout=300s
      # Windows must preserve ownership refusals; this job is not native admission.
      # Its elevated runner cannot qualify ordinary-user workspace initialization.
      - name: Product protocol, bootstrap refusal and package contracts
        working-directory: adapters/mcp
        # The actual first-install tracer runs separately on an admitted native
        # runner. Elevated Windows CI cannot qualify ordinary-user installation.
        run: go test ./... -skip '^(TestModernFactoryFirstInstallAndRestart|TestDirectInnerInstallRequiresProductionAuthority|TestModernSyncedSourceLifecycle|TestSyncedPublicationInterleavingAndReadOnlyReviews|TestProductDarwinSDKAndShippingStdioLifecycle)$' -timeout=900s
      - name: Product module static checks
        working-directory: adapters/mcp
        run: go vet ./...
      - name: Product binary excludes development packages
        if: runner.os == 'Linux'
        working-directory: adapters/mcp
        shell: bash
        run: |
          dependencies=$(go list -deps ./cmd/maestro-mcp)
          if printf '%s\n' "$dependencies" | grep -E '/(dev/|internal/dev/)'; then
            echo 'A product executable cannot depend on development packages.' >&2
            exit 1
          fi

  modern-first-install:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Select physical macOS temporary directory
        if: runner.os == 'macOS'
        shell: bash
        run: |
          physical_temp="$(cd "$RUNNER_TEMP" && pwd -P)"
          printf 'TMPDIR=%s\n' "$physical_temp" >> "$GITHUB_ENV"
      - name: Bind fixture paths to the assigned runner
        shell: bash
        env:
          MAESTRO_MODERN_BASELINE: ${{ runner.temp }}/maestro-modern-baseline
          MAESTRO_MODERN_TEST_ROOT: ${{ runner.temp }}/maestro-modern-first-install
          MAESTRO_MODERN_AUTHORITY_ROOT: ${{ runner.temp }}/maestro-modern-authority
        run: |
          printf '%s\n' "MAESTRO_MODERN_BASELINE=$MAESTRO_MODERN_BASELINE" >> "$GITHUB_ENV"
          printf '%s\n' "MAESTRO_MODERN_TEST_ROOT=$MAESTRO_MODERN_TEST_ROOT" >> "$GITHUB_ENV"
          printf '%s\n' "MAESTRO_MODERN_AUTHORITY_ROOT=$MAESTRO_MODERN_AUTHORITY_ROOT" >> "$GITHUB_ENV"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: adapters/mcp/go.mod
      - name: Materialize the immutable pre-modern reader and writer
        shell: bash
        run: |
          git fetch --no-tags origin 62d7758b18b0e9deb616ceacc7c241a34f5b68ce
          mkdir "$MAESTRO_MODERN_BASELINE"
          git archive --format=tar 62d7758b18b0e9deb616ceacc7c241a34f5b68ce -o "$RUNNER_TEMP/maestro-modern-baseline.tar"
          tar -xf "$RUNNER_TEMP/maestro-modern-baseline.tar" -C "$MAESTRO_MODERN_BASELINE"
      - name: Modern signed contracts, review and legacy-provider refusal
        run: go test ./internal/installer ./internal/installtx ./internal/datahome ./internal/releasecontract ./internal/releaseverify ./internal/dev/releasepack ./internal/updateservice -run '^(TestModern|TestInstallationPreviewSharesSelectionWithoutGrantingAuthority|TestCheckModernStateRefusesBeforeProviderAccess|TestLegacySeededBuilderStillRefusesRemovedCLI|TestRootLicenseExceptionRemainsExactAndNonexecutable)' -count=1 -timeout=300s
      # Real factory/server/stdio processes; successful inner native admission
      # uses a controlled in-process fixture. No native client/model is invoked.
      - name: Actual modern factory, authority refusal, packets and restarted work
        working-directory: adapters/mcp
        shell: bash
        run: |
          evidence="$RUNNER_TEMP/maestro-modern-install.jsonl"
          if ! go test ./setup -run '^(TestModernFactoryFirstInstallAndRestart|TestDirectInnerInstallRequiresProductionAuthority)$' -count=1 -json -timeout=600s > "$evidence"; then
            cat "$evidence"
            exit 1
          fi
          cat "$evidence"
          python3 - "$evidence" <<'PYCODE'
          import json, pathlib, sys
          events = [json.loads(line) for line in pathlib.Path(sys.argv[1]).read_text().splitlines()]
          passed = {e.get("Test") for e in events if e.get("Action") == "pass"}
          required = {"TestModernFactoryFirstInstallAndRestart", "TestDirectInnerInstallRequiresProductionAuthority"}
          assert required <= passed, "modern actual-process evidence missing: " + repr(required - passed)
          PYCODE

  modern-synced-update:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Select physical macOS temporary directory
        if: runner.os == 'macOS'
        shell: bash
        run: |
          physical_temp="$(cd "$RUNNER_TEMP" && pwd -P)"
          printf 'TMPDIR=%s\n' "$physical_temp" >> "$GITHUB_ENV"
      - name: Bind fixture paths to the assigned runner
        shell: bash
        env:
          MAESTRO_SYNCED_UPDATE_BASELINE: ${{ runner.temp }}/maestro-synced-update-baseline
          MAESTRO_SYNCED_TEST_ROOT: ${{ runner.temp }}/maestro-synced-update
          MAESTRO_SYNCED_R1_TEST_ROOT: ${{ runner.temp }}/maestro-synced-publication
        run: |
          printf '%s\n' "MAESTRO_SYNCED_UPDATE_BASELINE=$MAESTRO_SYNCED_UPDATE_BASELINE" >> "$GITHUB_ENV"
          printf '%s\n' "MAESTRO_SYNCED_TEST_ROOT=$MAESTRO_SYNCED_TEST_ROOT" >> "$GITHUB_ENV"
          printf '%s\n' "MAESTRO_SYNCED_R1_TEST_ROOT=$MAESTRO_SYNCED_R1_TEST_ROOT" >> "$GITHUB_ENV"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: adapters/mcp/go.mod
      - name: Materialize the exact pre-source-aware public implementation
        shell: bash
        run: |
          git fetch --no-tags origin 8c1ede63fef4b3a5a17d2d4471e4dc5b4f8c37fe
          mkdir "$MAESTRO_SYNCED_UPDATE_BASELINE"
          git archive --format=tar 8c1ede63fef4b3a5a17d2d4471e4dc5b4f8c37fe -o "$RUNNER_TEMP/maestro-synced-update-baseline.tar"
          tar -xf "$RUNNER_TEMP/maestro-synced-update-baseline.tar" -C "$MAESTRO_SYNCED_UPDATE_BASELINE"
      - name: Signed source, private transport and protected custody contracts
        run: go test ./internal/releasecontract ./internal/releaseverify ./internal/releaseprovider ./internal/dev/releasepack ./internal/installtx ./internal/updateplan ./internal/updateservice ./internal/installer -run '^(TestSignedGeneration|TestVerifyGeneration|TestGeneration|TestSourceAwareServerIdentity|TestWriteStateCannotDowngradeProtectedSourceCustody|TestSyncedMetadataExactByteAdmissionBudget|TestSourceCustodyWorstAdmittedExactByteEnvelopesRoundTrip)' -count=1 -timeout=180s
      # Real factory/installer/MCP processes and the preserved old public owner.
      # Positive native admission uses controlled in-process engineering trust;
      # the actual default unsigned installer must still refuse independently.
      - name: Actual signed update, continuation, recovery and compatible rollback
        working-directory: adapters/mcp
        shell: bash
        run: |
          evidence="$RUNNER_TEMP/maestro-modern-synced-update.jsonl"
          if ! go test ./setup -run '^TestModernSyncedSourceLifecycle$' -count=1 -json -timeout=900s > "$evidence"; then
            cat "$evidence"
            exit 1
          fi
          cat "$evidence"
          python3 - "$evidence" <<'PYCODE'
          import json, pathlib, sys
          events = [json.loads(line) for line in pathlib.Path(sys.argv[1]).read_text().splitlines()]
          family = "TestModernSyncedSourceLifecycle"
          assert any(e.get("Action") == "pass" and e.get("Test") == family for e in events), "actual signed lifecycle missing or skipped"
          skipped = [e.get("Test") for e in events if e.get("Action") == "skip" and (e.get("Test") == family or e.get("Test", "").startswith(family + "/"))]
          assert not skipped, "actual signed lifecycle has skipped proof: " + repr(skipped)
          PYCODE

      # Test-only process synchronization preserves the real product identity,
      # source guards and canonical activation; it adds no production pause flag.
      - name: Source-aware publication interleaving and read-only legacy refusal
        working-directory: adapters/mcp
        shell: bash
        run: |
          evidence="$RUNNER_TEMP/maestro-synced-publication.jsonl"
          if ! go test ./setup -run '^TestSyncedPublicationInterleavingAndReadOnlyReviews$' -count=1 -json -timeout=480s > "$evidence"; then
            cat "$evidence"
            exit 1
          fi
          cat "$evidence"
          python3 - "$evidence" <<'PYCODE'
          import json, pathlib, sys
          events = [json.loads(line) for line in pathlib.Path(sys.argv[1]).read_text().splitlines()]
          family = "TestSyncedPublicationInterleavingAndReadOnlyReviews"
          assert any(e.get("Action") == "pass" and e.get("Test") == family for e in events), "actual publication/read-only proof missing or skipped"
          skipped = [e.get("Test") for e in events if e.get("Action") == "skip" and (e.get("Test") == family or e.get("Test", "").startswith(family + "/"))]
          assert not skipped, "actual publication/read-only proof has skipped cases: " + repr(skipped)
          PYCODE

