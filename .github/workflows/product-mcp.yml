      - 'internal/updateservice/**'
      - 'dev/release/**'
      - 'internal/releaseverify/**'
      - 'internal/releaseprovider/**'
      - 'internal/dev/releasepack/**'
      - 'cmd/maestro-docling-pack/**'
      - 'schemas/release-manifest-v2.schema.json'
      - 'schemas/memory-artifact.schema.json'
      - 'schemas/memory-commit.schema.json'
      - 'schemas/release-manifest-v2.schema.json'
      - 'schemas/release-generation.schema.json'
      - 'schemas/maintenance-jobs.schema.json'
