name: Maestro product MCP contracts

on:
  pull_request:
    paths:
      - 'adapters/mcp/**'
      - 'internal/execution/**'
      - 'internal/datahome/**'
      - 'internal/workspace/**'
      - '.github/workflows/product-mcp.yml'
  push:
    branches: [main]
    paths:
      - 'adapters/mcp/**'
      - 'internal/execution/**'
      - 'internal/datahome/**'
      - 'internal/workspace/**'
      - '.github/workflows/product-mcp.yml'

permissions:
  contents: read

jobs:
  product-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: adapters/mcp/go.mod
      - name: Inspect Windows trusted Go installation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installedRoot = (go env GOROOT).Trim()
          $candidate = Join-Path $installedRoot 'bin/go.exe'
          [PSCustomObject]@{
            installed_root = $installedRoot
            command_source = (Get-Command go -CommandType Application).Source
            candidate_exists = Test-Path -LiteralPath $candidate -PathType Leaf
          } | ConvertTo-Json -Compress |
            ForEach-Object { Write-Host "[DEBUG-maestro-go-root] $_" }
          Get-ChildItem -LiteralPath (Join-Path $installedRoot 'bin') |
            Select-Object -First 8 Name, FullName, Length, Attributes, LinkType, Target |
            ConvertTo-Json -Compress |
            ForEach-Object { Write-Host "[DEBUG-maestro-go-root] $_" }
          $probe = Join-Path $env:RUNNER_TEMP 'maestro-goroot-probe.go'
          @'
          package main
          import ("encoding/json"; "os"; "path/filepath"; "runtime")
          func main() {
            root := runtime.GOROOT()
            candidate := filepath.Join(root, "bin", "go.exe")
            candidateInfo, candidateErr := os.Stat(candidate)
            resolved, resolveErr := filepath.EvalSymlinks(candidate)
            info, statErr := os.Stat(resolved)
            out := map[string]any{"compiled_root": root, "candidate": candidate, "candidate_regular": candidateErr == nil && candidateInfo.Mode().IsRegular(), "resolved": resolved, "runtime_version": runtime.Version(), "trusted_go_regular": statErr == nil && info.Mode().IsRegular()}
            if candidateErr != nil { out["candidate_stat_error"] = candidateErr.Error() }
            if resolveErr != nil { out["resolve_error"] = resolveErr.Error() }
            if statErr != nil { out["stat_error"] = statErr.Error() }
            json.NewEncoder(os.Stdout).Encode(out)
          }
          '@ | Set-Content -Path $probe -Encoding utf8NoBOM
          $binary = Join-Path $env:RUNNER_TEMP 'maestro-goroot-probe.exe'
          go build -o $binary $probe
          if ($LASTEXITCODE -ne 0) { throw 'Go diagnostic build failed' }
          $savedGoRoot = $env:GOROOT
          [Environment]::SetEnvironmentVariable('GOROOT', $null, 'Process')
          try {
            & $binary | ForEach-Object { Write-Host "[DEBUG-maestro-go-root] $_" }
            if ($LASTEXITCODE -ne 0) { throw 'Go diagnostic execution failed' }
          } finally {
            [Environment]::SetEnvironmentVariable('GOROOT', $savedGoRoot, 'Process')
          }
      - name: Canonical ledger and HOME contracts
        run: go test ./internal/execution ./internal/datahome -timeout=180s
      - name: Canonical workspace initialization contracts on admitted Unix runners
        if: runner.os != 'Windows'
        run: go test ./internal/workspace -timeout=180s
      # Windows must preserve ownership refusals; this job is not native admission.
      # Its elevated runner cannot qualify ordinary-user workspace initialization.
      - name: Product protocol, bootstrap refusal and package contracts
        working-directory: adapters/mcp
        run: go test ./... -timeout=180s
      - name: Product module static checks
        working-directory: adapters/mcp
        run: go vet ./...
      - name: Product binary excludes development packages
        if: runner.os == 'Linux'
        working-directory: adapters/mcp
        shell: bash
        run: |
          dependencies=$(go list -deps ./cmd/maestro-mcp)
          if printf '%s\n' "$dependencies" | grep -E '/(dev/|internal/dev/)'; then
            echo 'A product executable cannot depend on development packages.' >&2
            exit 1
          fi
