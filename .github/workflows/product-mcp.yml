      - 'acceptance/fixtures/private-wiki-old-writer/**'
      - 'acceptance/fixtures/private-wiki-producer/**'
      - 'internal/execution/**'
      - 'internal/datahome/**'
      - 'internal/scheduler/**'
      - 'internal/winprivate/**'
      - 'internal/processidentity/**'
      - 'internal/privatelock/**'
      - 'internal/userlevel/**'
      - 'internal/zipmigration/**'
      - 'internal/zipruntime/**'
      - 'internal/adaptercfg/**'
      - 'internal/claudeadapter/**'
      - 'internal/claudeagents/**'
      - 'internal/nativeagentflow/**'
      - 'internal/sessionctx/**'
      - 'internal/sessionhook/**'
      - 'internal/lifecycle/**'
      - 'internal/workspacepolicy/**'
      - 'go.mod'
      - 'go.sum'
      - 'internal/workspace/**'
      - 'internal/ownerctx/**'
