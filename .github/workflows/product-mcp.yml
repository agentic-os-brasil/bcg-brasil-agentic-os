name: Maestro product MCP contracts

on:
  pull_request:
    paths:
      - 'adapters/mcp/**'
      - 'internal/execution/**'
      - 'internal/datahome/**'
      - 'internal/zipmigration/**'
      - 'internal/zipruntime/**'
      - 'go.mod'
      - 'go.sum'
      - 'internal/workspace/**'
      - 'internal/ownerctx/**'
      - 'internal/memory/**'
      - 'internal/atlas/**'
      - 'internal/atlasops/**'
      - 'internal/ingest/**'
      - 'internal/scheduler/**'
      - 'internal/releasecontract/**'
      - 'internal/releaseverify/**'
      - 'internal/dev/releasepack/**'
      - 'cmd/maestro-docling-pack/**'
      - 'schemas/memory-artifact.schema.json'
      - 'schemas/memory-commit.schema.json'
      - 'bundles/**'
      - 'LICENSE.md'
      - '.github/workflows/product-mcp.yml'
  push:
    branches: [main]
    paths:
      - 'adapters/mcp/**'
      - 'internal/execution/**'
      - 'internal/datahome/**'
      - 'internal/zipmigration/**'
      - 'internal/zipruntime/**'
      - 'go.mod'
      - 'go.sum'
      - 'internal/workspace/**'
      - 'internal/ownerctx/**'
      - 'internal/memory/**'
      - 'internal/atlas/**'
      - 'internal/atlasops/**'
      - 'internal/ingest/**'
      - 'internal/scheduler/**'
      - 'internal/releasecontract/**'
      - 'internal/releaseverify/**'
      - 'internal/dev/releasepack/**'
      - 'cmd/maestro-docling-pack/**'
      - 'schemas/memory-artifact.schema.json'
      - 'schemas/memory-commit.schema.json'
      - 'bundles/**'
      - 'LICENSE.md'
      - '.github/workflows/product-mcp.yml'

permissions:
  contents: read

jobs:
  product-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: adapters/mcp/go.mod
      # shortcut: runner toolcache paths fail Go canonicalization; remove when unchanged witness tests pass there.
      # Related upstream report: https://github.com/golang/go/issues/82447
      - name: Stage Windows SDK for canonical command evidence
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installedRoot = (go env GOROOT).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Installed Go SDK lookup failed' }
          if ($env:GOROOT) { throw 'Command evidence requires no caller-supplied GOROOT' }
          $stagedRoot = Join-Path $env:RUNNER_TEMP 'maestro-go-sdk'
          $freshCache = Join-Path $env:RUNNER_TEMP 'maestro-go-build'
          New-Item -ItemType Directory -Path $stagedRoot -ErrorAction Stop | Out-Null
          New-Item -ItemType Directory -Path $freshCache -ErrorAction Stop | Out-Null
          Get-ChildItem -LiteralPath $installedRoot -Force -ErrorAction Stop |
            Copy-Item -Destination $stagedRoot -Recurse -ErrorAction Stop
          $installedGo = Join-Path $installedRoot 'bin/go.exe'
          $stagedBin = Join-Path $stagedRoot 'bin'
          $stagedGo = Join-Path $stagedBin 'go.exe'
          if ((Get-FileHash -LiteralPath $installedGo -Algorithm SHA256).Hash -ne
              (Get-FileHash -LiteralPath $stagedGo -Algorithm SHA256).Hash) {
            throw 'Staged Go executable differs from pinned SDK'
          }
          $selectedRoot = (& $stagedGo env GOROOT).Trim()
          if ($LASTEXITCODE -ne 0 -or $selectedRoot -ne $stagedRoot) {
            throw 'Staged Go executable did not select its copied SDK'
          }
          $stagedBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "GOCACHE=$freshCache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Canonical ledger, HOME, owner and memory contracts
        run: go test ./internal/execution ./internal/datahome ./internal/ownerctx ./internal/memory -timeout=300s
      - name: Canonical workspace initialization contracts on admitted Unix runners
        if: runner.os != 'Windows'
        run: go test ./internal/workspace -timeout=180s
      - name: Canonical workspace knowledge and verified ingestion contracts
        if: runner.os != 'Windows'
        run: go test ./internal/atlasops ./internal/ingest/... ./internal/releasecontract ./internal/releaseverify ./internal/scheduler -timeout=300s
      # Windows must preserve ownership refusals; this job is not native admission.
      # Its elevated runner cannot qualify ordinary-user workspace initialization.
      - name: Product protocol, bootstrap refusal and package contracts
        working-directory: adapters/mcp
        run: go test ./... -timeout=600s
      - name: Product module static checks
        working-directory: adapters/mcp
        run: go vet ./...
      - name: Product binary excludes development packages
        if: runner.os == 'Linux'
        working-directory: adapters/mcp
        shell: bash
        run: |
          dependencies=$(go list -deps ./cmd/maestro-mcp)
          if printf '%s\n' "$dependencies" | grep -E '/(dev/|internal/dev/)'; then
            echo 'A product executable cannot depend on development packages.' >&2
            exit 1
          fi

  authenticated-docling:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      MAESTRO_DOCLING_TEST_INPUTS: ${{ runner.temp }}/maestro-raw-inputs
      MAESTRO_DOCLING_TEST_ROOT: ${{ runner.temp }}/maestro-engineering-runtime
      MAESTRO_DOCLING_RETAINED_ROOT: ${{ runner.temp }}/maestro-engineering-runtime
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: adapters/mcp/go.mod
      - name: Require the admitted runtime platform
        shell: bash
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          test -x /usr/bin/sandbox-exec
      # Acquisition is CI-only; the offline assembler verifies every input again.
      - name: Acquire exact official runtime inputs
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import hashlib, json, os, pathlib, re, urllib.parse, urllib.request
          root = pathlib.Path(os.environ["MAESTRO_DOCLING_TEST_INPUTS"])
          root.mkdir(mode=0o700)
          source = pathlib.Path("internal/ingest/docling/assemble.go").read_text()
          def constant(name):
              match = re.search(r'^\s*' + name + r'\s*=\s*"([^"\n]+)"', source, re.M)
              assert match, "missing canonical runtime constant: " + name
              return match.group(1)
          filename, expected = constant("PythonArchive"), constant("PythonArchiveSHA256")
          tag = constant("PythonVersion").split("+")[1]
          assert re.fullmatch(r"[0-9]{8}", tag)
          inputs = json.loads(pathlib.Path("internal/ingest/docling/runtime/inputs.json").read_text())
          assert len(inputs) == 51 and len({x["filename"] for x in inputs}) == 51
          assert sum(x["size"] for x in inputs) <= 512 << 20
          for item in inputs:
              parsed = urllib.parse.urlsplit(item["url"])
              assert parsed.scheme == "https" and parsed.netloc == "files.pythonhosted.org"
          inputs.append({"filename": filename, "sha256": expected, "size": 256 << 20,
                         "url": "https://github.com/astral-sh/python-build-standalone/releases/download/" + tag + "/" + filename})
          for item in inputs:
              name, expected, size = item["filename"], item["sha256"], item["size"]
              assert pathlib.PurePosixPath(name).name == name and name not in (".", "..") and "\\" not in name
              assert re.fullmatch(r"[0-9a-f]{64}", expected) and 0 < size <= 256 << 20
              target = root / name
              digest, count = hashlib.sha256(), 0
              request = urllib.request.Request(item["url"], headers={"User-Agent": "maestro-runtime-ci"})
              with urllib.request.urlopen(request, timeout=60) as response, target.open("xb") as output:
                  while chunk := response.read(1 << 20):
                      count += len(chunk)
                      assert count <= size, "input exceeds pinned size: " + name
                      digest.update(chunk)
                      output.write(chunk)
              assert digest.hexdigest() == expected, "input digest mismatch: " + name
              if name != filename:
                  assert count == size, "input size mismatch: " + name
              print("verified", name, count, expected)
          PYCODE
      - name: Prove authenticated offline conversion and refusal contracts
        shell: bash
        run: |
          evidence="$RUNNER_TEMP/maestro-docling-tests.jsonl"
          if ! go test ./internal/ingest/docling -run '^TestAuthenticatedRealDocling$' -count=1 -json -timeout=900s > "$evidence"; then
            cat "$evidence"
            exit 1
          fi
          cat "$evidence"
          python3 - "$evidence" <<'PYCODE'
          import json, pathlib, sys
          events = [json.loads(line) for line in pathlib.Path(sys.argv[1]).read_text().splitlines()]
          assert any(e.get("Action") == "pass" and e.get("Test") == "TestAuthenticatedRealDocling" for e in events), "real converter acceptance did not run"
          PYCODE
      - name: Bind the retained public engineering authority
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import hashlib, os, pathlib
          root = pathlib.Path(os.environ["MAESTRO_DOCLING_RETAINED_ROOT"])
          seed = hashlib.sha256((root / "authority.json").read_bytes()).hexdigest()
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write("MAESTRO_DOCLING_RETAINED_SEED=" + seed + "\n")
          PYCODE
      - name: Prove actual SDK and compiled-stdio content journeys
        working-directory: adapters/mcp
        shell: bash
        run: |
          evidence="$RUNNER_TEMP/maestro-content-tests.jsonl"
          if ! go test . -run '^TestContentRealJourneys$' -count=1 -json -timeout=900s > "$evidence"; then
            cat "$evidence"
            exit 1
          fi
          cat "$evidence"
          python3 - "$evidence" <<'PYCODE'
          import json, pathlib, sys
          events = [json.loads(line) for line in pathlib.Path(sys.argv[1]).read_text().splitlines()]
          passed = {e.get("Test") for e in events if e.get("Action") == "pass"}
          required = {"TestContentRealJourneys/sdk", "TestContentRealJourneys/compiled_stdio"}
          assert required <= passed, "real SDK/stdio content acceptance did not run: " + repr(required - passed)
          PYCODE
      - name: Prove policy formats through reviewed knowledge and restarted packets
        working-directory: adapters/mcp
        shell: bash
        env:
          MAESTRO_POLICY_PUBLIC_ROOT: ${{ runner.temp }}/maestro-policy-public
        run: |
          evidence="$RUNNER_TEMP/maestro-policy-content-tests.jsonl"
          if ! go test . -run '^TestContentPolicyRealJourneys$' -count=1 -json -timeout=45m > "$evidence"; then
            cat "$evidence"
            exit 1
          fi
          cat "$evidence"
          python3 - "$evidence" <<'PYCODE'
          import json, pathlib, sys
          events = [json.loads(line) for line in pathlib.Path(sys.argv[1]).read_text().splitlines()]
          passed = {e.get("Test") for e in events if e.get("Action") == "pass"}
          prefix = "TestContentPolicyRealJourneys"
          cases = ("csv", "docx", "epub", "htm", "html", "json", "md", "txt", "xls", "xlsx", "xml",
                   "validated_export", "controls", "partial", "parser_tamper")
          required = {prefix + "/" + transport + "/" + case
                      for transport in ("sdk", "compiled_stdio") for case in cases}
          required.add(prefix + "/compiled_stdio/mcpb_readback")
          assert required <= passed, "policy SDK/stdio acceptance did not run: " + repr(sorted(required - passed))
          PYCODE
