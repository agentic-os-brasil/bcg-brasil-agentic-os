name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  development-harness:
    name: development harness (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Record validation context
        shell: bash
        run: |
          {
            echo "### Validation context"
            echo "- runner: ${RUNNER_OS}/${RUNNER_ARCH}"
            echo "- ref: ${GITHUB_REF}"
            echo "- commit: $(git rev-parse HEAD)"
            go version
            go env GOOS GOARCH
          } | tee -a "${GITHUB_STEP_SUMMARY}"
      - name: Run full development harness (includes parsed action-pin policy)
        id: development_harness
        run: go run ./dev/harness validate --full
      - name: Validate Windows clean-device operator script syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "acceptance/clean-device/windows.ps1"),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw "Windows clean-device script has parser errors."
          }
      - name: Validate Windows installer packaging script syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "dev/release/build-windows-installer.ps1"),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw "Windows installer packaging script has parser errors."
          }
      - name: Validate macOS clean-device operator script syntax
        if: runner.os == 'macOS'
        shell: bash
        run: bash -n acceptance/clean-device/macos.sh
      - name: Smoke-test local trial installation
        if: runner.os != 'Windows'
        shell: bash
        run: ./dev/trial-install-smoke.sh
      - name: Smoke-test Claude hook from nested directory
        shell: bash
        working-directory: specs
        run: |
          output=$(printf '%s' '{"tool_name":"Bash","tool_input":{"command":"git reset --hard HEAD"}}' | CLAUDE_PROJECT_DIR="$GITHUB_WORKSPACE" bash "$GITHUB_WORKSPACE/.claude/hooks/run-dev-hook.sh" pre-tool)
          case "$output" in
            *'"permissionDecision":"deny"'*) ;;
            *) echo "Claude hook did not deny destructive Git command"; exit 1 ;;
          esac
      - name: Smoke-test Windows contributor bootstrap
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git switch -C main
          ./dev/bootstrap/windows.ps1 -GitName "BCG OS CI" -GitEmail "ci@example.invalid" -NonInteractive

          $mainOutput = (& git commit --allow-empty -m "test: main hook must block" 2>&1 | Out-String)
          if ($LASTEXITCODE -eq 0 -or $mainOutput -notmatch "commits na branch principal") {
            throw "pre-commit hook did not block a commit on main"
          }

          git switch -c ci/hook-smoke
          git commit --allow-empty -m "test: safe branch hook executes"
          if ($LASTEXITCODE -ne 0) {
            throw "pre-commit hook did not allow a validated branch commit"
          }
      - name: Smoke-test Windows local trial installation
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./dev/trial-install-smoke.ps1
      - name: Record validation completion
        if: always()
        shell: bash
        run: |
          {
            echo "### Validation completion"
            echo "- job: ${GITHUB_JOB}"
            echo "- harness outcome: ${{ steps.development_harness.outcome }}"
            echo "- job status: ${{ job.status }}"
            echo "- checkout: $(git rev-parse --short HEAD 2>/dev/null || echo unavailable)"
            git status --short --branch 2>/dev/null || true
          } | tee -a "${GITHUB_STEP_SUMMARY}"
