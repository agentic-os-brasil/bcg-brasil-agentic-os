name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  development-harness:
    name: development harness (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Run full development harness
        run: go run ./dev/harness validate --full
      - name: Smoke-test Claude hook from nested directory
        shell: bash
        working-directory: specs
        run: |
          output=$(printf '%s' '{"tool_name":"Bash","tool_input":{"command":"git reset --hard HEAD"}}' | CLAUDE_PROJECT_DIR="$GITHUB_WORKSPACE" bash "$GITHUB_WORKSPACE/.claude/hooks/run-dev-hook.sh" pre-tool)
          case "$output" in
            *'"permissionDecision":"deny"'*) ;;
            *) echo "Claude hook did not deny destructive Git command"; exit 1 ;;
          esac
