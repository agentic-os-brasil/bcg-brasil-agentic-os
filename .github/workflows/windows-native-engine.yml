name: Maestro Windows native engine

on:
  workflow_dispatch:
  push:
    branches: [main, codex/integration/maestro-main-windows-engine, codex/integration/maestro-main-authored-brain]
    paths:
      - 'internal/**'
      - 'adapters/mcp/**'
      - 'dev/pilot/**'
      - 'acceptance/windows-core-pilot.ps1'
      - 'acceptance/windows-engine-build.ps1'
      - 'acceptance/windows-engine-check.ps1'
      - 'acceptance/windows-engine-evidence.ps1'
      - 'acceptance/test_windows_profile_driver.py'
      - '.github/workflows/windows-native-engine.yml'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    paths:
      - 'internal/**'
      - 'adapters/mcp/**'
      - 'dev/pilot/**'
      - 'acceptance/windows-core-pilot.ps1'
      - 'acceptance/windows-engine-build.ps1'
      - 'acceptance/windows-engine-check.ps1'
      - 'acceptance/windows-engine-evidence.ps1'
      - 'acceptance/test_windows_profile_driver.py'
      - '.github/workflows/windows-native-engine.yml'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

jobs:
  pilot-artifact:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: adapters/mcp/go.mod
      - name: Verify the Mac shared-source frontend protocol
        working-directory: .
        shell: bash
        env:
          GOTOOLCHAIN: local
        run: |
          evidence="$RUNNER_TEMP/maestro-mac-source-frontend.jsonl"
          if ! go test ./dev/pilot/installed-seed-factory -run '^TestMacSelfServicePreparesExactOwnerClientsAndPreservesProfile$' -count=1 -json -timeout=180s > "$evidence"; then
            cat "$evidence"
            exit 1
          fi
          cat "$evidence"
          python3 - "$evidence" <<'PYTHON'
          import json, pathlib, sys
          events = [json.loads(line) for line in pathlib.Path(sys.argv[1]).read_text().splitlines()]
          parent = "TestMacSelfServicePreparesExactOwnerClientsAndPreservesProfile"
          assert sum(e.get("Action") == "pass" and e.get("Test") == parent for e in events) == 1, "exact Mac frontend parent must pass once"
          assert not any(e.get("Action") in ("skip", "fail") for e in events), "Mac frontend proof skipped or failed"
          PYTHON
      - name: Build one generic engineering ZIP with the existing constructor
        shell: bash
        env:
          GOTOOLCHAIN: local
        run: |
          mkdir -p "$HOME/Developer"
          ./dev/pilot/build-kit.sh "$HOME/Developer/Maestro-Pilot-Artifact" --lifecycle-context
          python3 - <<'PYTHON'
          import hashlib, json, os, subprocess
          from pathlib import Path
          root = Path.home() / "Developer"
          kit = root / "Maestro-Pilot-Artifact"
          digest = lambda path: hashlib.sha256(path.read_bytes()).hexdigest()
          identity = dict(schema_version=1,
              source_revision=subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              source_tree=subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip(),
              producer_run_id=os.environ["GITHUB_RUN_ID"],
              generic_zip_sha256=digest(root / "Maestro-Pilot-Artifact.zip"),
              kit_id=(kit / "KIT-ID.txt").read_text().strip(),
              shipping_server_sha256=digest(kit / "bin/maestro-mcp-windows-amd64.exe"))
          (root / "pilot-artifact-input.json").write_text(json.dumps(identity, indent=2) + "\n")
          print(json.dumps(identity))
          PYTHON
      - name: Retain the same ZIP and its exact producer identity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maestro-pilot-zip-${{ github.sha }}
          path: |
            ~/Developer/Maestro-Pilot-Artifact.zip
            ~/Developer/Maestro-Pilot-Artifact.zip.sha256
            ~/Developer/pilot-artifact-input.json
          if-no-files-found: error
          retention-days: 7
  native-engine:
    needs: pilot-artifact
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: adapters/mcp/go.mod
      - name: Verify the Windows PowerShell 5.1 shared-source frontend protocol
        working-directory: .
        shell: pwsh
        env:
          GOTOOLCHAIN: local
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'maestro-windows-source-frontend.jsonl'
          go test ./dev/pilot/installed-seed-factory -run '^(TestWindowsSelfServiceExactOwnerAndSelectedProfile|TestWindowsSelfServiceDesktopSelectionAvoidsCode|TestParticipantPowerShellPromptConsumersPreserveUTF8)$' -count=1 -json -timeout=180s | Tee-Object -FilePath $evidence
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $events = @(Get-Content -LiteralPath $evidence | ForEach-Object { $_ | ConvertFrom-Json })
          $parents = @('TestWindowsSelfServiceExactOwnerAndSelectedProfile', 'TestWindowsSelfServiceDesktopSelectionAvoidsCode', 'TestParticipantPowerShellPromptConsumersPreserveUTF8')
          $invalid = @($events | Where-Object { $_.Action -in @('skip','fail') })
          if ($invalid.Count -ne 0) { throw 'Exact Windows frontend families must have no skips or failures' }
          foreach ($parent in $parents) {
            $passed = @($events | Where-Object { $_.Action -ceq 'pass' -and $_.Test -ceq $parent })
            if ($passed.Count -ne 1) { throw "Exact Windows frontend parent must pass once: $parent" }
          }
      - name: Download the immutable generic ZIP from this producing run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: maestro-pilot-zip-${{ github.sha }}
          path: ${{ runner.temp }}/pilot-artifact
      - name: Stage exact public source, SDK and shipping executables
        shell: pwsh
        run: |
          ./acceptance/windows-engine-build.ps1 -KitArchive (Join-Path $env:RUNNER_TEMP 'pilot-artifact/Maestro-Pilot-Artifact.zip') -KitIdentity (Join-Path $env:RUNNER_TEMP 'pilot-artifact/pilot-artifact-input.json')
      - name: Public init, restart and owned-process hooks under the actual ordinary account
        shell: pwsh
        run: |
          ./acceptance/windows-core-pilot.ps1 -TestBinary (Join-Path $env:MAESTRO_ENGINE_PUBLIC_ROOT 'bin/mcp.test.exe') -Server (Join-Path $env:MAESTRO_ENGINE_PUBLIC_ROOT 'bin/maestro-mcp.exe') -AuthoredBrain -PrivateWiki -AtlasTestBinary (Join-Path $env:MAESTRO_ENGINE_PUBLIC_ROOT 'bin/atlasops.test.exe') -CanonicalManifest (Join-Path $env:MAESTRO_ENGINE_PUBLIC_ROOT 'engine-build-manifest.json') -Kit $env:MAESTRO_ENGINE_PILOT_KIT -KitIdentity $env:MAESTRO_ENGINE_PILOT_IDENTITY -MethodFixture (Join-Path $env:MAESTRO_ENGINE_PUBLIC_ROOT 'source/adapters/mcp/packaging/testdata/method-ids.txt') -OutputRoot (Join-Path $env:RUNNER_TEMP 'native-engine-proof')
      - name: Stage only bounded synthetic evidence
        if: always()
        shell: pwsh
        run: |
          ./acceptance/windows-engine-evidence.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: windows-native-engine-${{ github.sha }}
          path: ${{ runner.temp }}/native-engine-evidence/
          if-no-files-found: error
          retention-days: 7
