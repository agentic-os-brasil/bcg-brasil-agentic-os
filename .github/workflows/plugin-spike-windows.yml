name: Plugin spike Windows rehearsal

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: ${{ matrix.shell }}
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Direct synthetic probes; no Claude or corporate-host qualification
        run: |
          & ./dev/spikes/plugin429/windows-rehearsal.ps1 -Destination "$env:USERPROFILE/Developer/CodexWorkspace/Windows Plugin Spike ${{ matrix.shell }}"
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: windows-spike-synthetic-${{ matrix.shell }}
          path: ~/Developer/CodexWorkspace/Windows Plugin Spike ${{ matrix.shell }}/windows-rehearsal.json
          if-no-files-found: error
          retention-days: 7
