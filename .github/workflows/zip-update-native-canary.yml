name: ZIP update native canary

on:
  workflow_dispatch:
    inputs:
      from_version:
        description: Installed field version
        required: true
        default: 0.1.11
      to_version:
        description: Candidate version
        required: true
        default: 0.1.12

permissions:
  contents: read

jobs:
  offline-native:
    name: ZIP offline native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Reject false-positive live Agent traces
        run: |
          . installers/zip/user-template/.claude/hooks/lib/python.sh
          maestro_py -m unittest acceptance/zip-update/test_eval_live_agent_trace.py
      - name: Build exact release ZIP
        run: bash installers/zip/build-release.sh "${{ inputs.to_version }}"
      - name: Evaluate release and platform wiring
        run: |
          bash acceptance/zip-update/native-smoke.sh \
            --zip "dist/Maestro-v${{ inputs.to_version }}.zip" \
            --output "${RUNNER_OS}-offline.json"
      - name: Build user-facing update kit
        run: |
          bash installers/zip/build-update-package.sh \
            "${{ inputs.from_version }}" "${{ inputs.to_version }}"
          bash installers/zip/eval-update-package.sh \
            --zip "dist/Maestro-Update-v${{ inputs.to_version }}.zip" \
            --from-version "${{ inputs.from_version }}" \
            --to-version "${{ inputs.to_version }}"
      - name: Upload sanitized offline receipt
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: zip-offline-${{ runner.os }}
          path: ${{ runner.os }}-offline.json
          if-no-files-found: error
