name: Windows native core MCP

on:
  push:
    branches: [codex/maestro-windows-core]
  pull_request:
    paths:
      - 'adapters/mcp/**'
      - 'internal/datahome/**'
      - 'internal/execution/**'
      - 'internal/memory/**'
      - 'internal/ownerctx/**'
      - 'internal/maintenance/**'
      - 'internal/scheduler/**'
      - 'acceptance/windows-core-pilot.ps1'
      - '.github/workflows/windows-mcp-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ordinary-user-core:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: adapters/mcp/go.mod
      - name: Build ordinary shipping server and dedicated native witness
        working-directory: adapters/mcp
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP 'windows-core-build'
          New-Item -ItemType Directory -Path $build | Out-Null
          go build -trimpath -o (Join-Path $build 'maestro-mcp.exe') ./cmd/maestro-mcp
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          go test -c -o (Join-Path $build 'windows-core.test.exe') .
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Actual standard-user core journey
        shell: pwsh
        run: |
          ./acceptance/windows-core-pilot.ps1 -TestBinary (Join-Path $env:RUNNER_TEMP 'windows-core-build/windows-core.test.exe') -Server (Join-Path $env:RUNNER_TEMP 'windows-core-build/maestro-mcp.exe') -OutputRoot (Join-Path $env:RUNNER_TEMP 'windows-core-proof')
      - name: Keep native proof and actual refusal logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-native-core-proof
          path: |
            ${{ runner.temp }}/windows-core-proof/*.log
            ${{ runner.temp }}/windows-core-proof/*.json
          retention-days: 7
