name: ZIP v0.2.0 native parity

on:
  pull_request:
    paths:
      - 'installers/zip/**'
      - 'acceptance/zip-update/**'
      - 'internal/zipmigration/**'
      - 'internal/zipruntime/**'
      - 'internal/codexadapter/**'
      - 'cmd/maestro-runtime/**'
      - '.github/workflows/zip-v020-parity.yml'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Build Windows ZIP with both native architectures
        run: bash installers/zip/build-release.sh 0.2.0 windows-powershell
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: windows-zip-candidate
          path: |
            dist/Maestro-v0.2.0-windows-powershell.zip
            dist/Maestro-v0.2.0-windows-powershell.sha256
          if-no-files-found: error
  windows-native:
    needs: windows-package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-zip-candidate
          path: package
      - name: Require an actual non-elevated Windows process
        shell: pwsh
        run: |
          go run ./cmd/maestro-runtime preflight
          if ($LASTEXITCODE -ne 0) {
            throw "Windows qualification requires an approved non-elevated runner. Do not disable the token-elevation guard or change machine permissions. This environment cannot qualify user installation."
          }
      - name: Shared native migration and isolation contracts
        shell: pwsh
        run: go test ./internal/zipmigration ./internal/zipruntime ./cmd/maestro-runtime
      - name: Windows PowerShell 5.1 all nine hooks and both upgrades
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5) { throw 'Expected native Windows PowerShell 5.1' }
          & ./acceptance/zip-update/powershell-hook-smoke.ps1 -MaestroRoot $PWD.Path
          if ($LASTEXITCODE -ne 0) { throw 'PowerShell 5.1 smoke failed' }
      - name: Windows PowerShell 7 all nine hooks and both upgrades
        shell: pwsh
        run: |
          if ($PSVersionTable.PSVersion.Major -lt 7) { throw 'Expected native PowerShell 7' }
          & ./acceptance/zip-update/powershell-hook-smoke.ps1 -MaestroRoot $PWD.Path
          if ($LASTEXITCODE -ne 0) { throw 'PowerShell 7 smoke failed' }
      - name: Verify the packaged Windows ZIP in PowerShell 5.1
        shell: powershell
        run: |
          & ./acceptance/zip-update/native-smoke.ps1 -Zip ./package/Maestro-v0.2.0-windows-powershell.zip -Output windows-5.1-offline.json
      - name: Verify the packaged Windows ZIP in PowerShell 7
        shell: pwsh
        run: |
          & ./acceptance/zip-update/native-smoke.ps1 -Zip ./package/Maestro-v0.2.0-windows-powershell.zip -Output windows-7-offline.json
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: windows-offline-hook-evidence
          path: windows-*-offline.json
          if-no-files-found: error
  cross-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [windows, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Build the same migration and hook engine for each package target
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -trimpath -o '${{ runner.temp }}/maestro-runtime' ./cmd/maestro-runtime
